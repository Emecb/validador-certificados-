<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador Documental</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">

        <h1>Validador Documental</h1>

        <p>Verificación de certificados</p>

        <input
            id="codigo"
            type="text"
            placeholder="INS-2026-00001">

        <button onclick="consultar()">
            Consultar
        </button>

        <button onclick="limpiar()">
            Limpiar
        </button>

    </div>

    <script>

        function limpiar() {

            document.getElementById("codigo").value = "";
            document.getElementById("codigo").focus();

        }

        function consultar() {

            const codigo = document.getElementById("codigo").value.trim();

            if (!codigo) {

                alert("Ingrese un código");
                return;

            }

            window.location.href =
                "https://script.google.com/macros/s/AKfycbyCY-W8YDI8vzvR53AKJplHkUdllz_eahPRmwiuUoD86zVc3ZRWhPgrZymZ7nzZ6AvnJA/exec?id="
                + encodeURIComponent(codigo);

        }

    </script>

</body>

</html>

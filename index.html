<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador Documental</title>

    style.css
</head>

<body>

    <div class="card">

        <h1>Validador Documental</h1>

        <p>
            Verificación de certificados
        </p>

        <input
            id="codigo"
            type="text"
            placeholder="INS-2026-00001">

        <button onclick="consultar()">
            Consultar
        </button>

        <button onclick="limpiar()">
            Limpiar
        </button>

    </div>

    app.jsscript>

    <script>

        function consultar() {

            var codigo =
                document.getElementById("codigo").value;

            if (codigo === "") {

                alert("Ingrese un código");

                return;
            }

            window.location.href =
                "https://script.google.com/macros/s/AKfycbx0MHCnOg5K2ibmPLLcVAsMQiED45BdN-U7z7CF6TPreLIEIWbkgUwERCvoUElSAT57/exec?id="
                + encodeURIComponent(codigo);

        }

    </script>

</body>
</html>
